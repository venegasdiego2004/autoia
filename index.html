<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AUTOIA - Asistente Virtual</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 90vh;

      background: white;

      border-radius: 20px;

      overflow: hidden;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.15);

      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111827;
      color: white;

      padding: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 13px;
      color: #d1d5db;

      margin-top: 5px;
    }

    .status {
      margin-top: 10px;

      font-size: 12px;

      color: #86efac;
    }

    .messages {
      flex: 1;

      padding: 20px;

      overflow-y: auto;

      background: #f9fafb;
    }

    .message {
      max-width: 80%;

      padding: 12px 15px;

      margin-bottom: 12px;

      border-radius: 16px;

      line-height: 1.4;

      font-size: 14px;
    }

    .bot {
      background: white;

      border: 1px solid #e5e7eb;

      margin-right: auto;
    }

    .user {
      background: #111827;

      color: white;

      margin-left: auto;
    }

    .typing {
      font-style: italic;

      color: #6b7280;
    }

    .input-area {
      display: flex;

      padding: 12px;

      border-top: 1px solid #e5e7eb;

      background: white;

      gap: 8px;
    }

    input {
      flex: 1;

      padding: 13px;

      border: 1px solid #d1d5db;

      border-radius: 12px;

      outline: none;

      font-size: 14px;
    }

    button {
      border: none;

      background: #111827;

      color: white;

      padding: 0 18px;

      border-radius: 12px;

      font-size: 18px;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

  </style>

</head>


<body>

  <div class="chat-container">

    <div class="header">

      <div class="logo">
        🚗 AUTOIA
      </div>

      <div class="subtitle">
        Asistente virtual del concesionario
      </div>

      <div class="status">
        ● En línea
      </div>

    </div>


    <div
      class="messages"
      id="messages"
    >

      <div class="message bot">

        👋 ¡Hola!

        <br><br>

        Soy el asistente virtual del concesionario.

        <br><br>

        Puedo ayudarte a encontrar vehículos,
        resolver tus preguntas y ayudarte a
        solicitar una cita.

        <br><br>

        ¿Qué vehículo estás buscando?

      </div>

    </div>


    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Escribe tu mensaje..."
        autocomplete="off"
      >

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>


<script>

  const input =
    document.getElementById("userInput");

  const button =
    document.getElementById("sendButton");

  const messages =
    document.getElementById("messages");


  function addMessage(text, type) {

    const message =
      document.createElement("div");

    message.className =
      "message " + type;

    message.innerHTML =
      text.replace(/\n/g, "<br>");

    messages.appendChild(message);

    messages.scrollTop =
      messages.scrollHeight;
  }


  function showTyping() {

    const typing =
      document.createElement("div");

    typing.id =
      "typing";

    typing.className =
      "message bot typing";

    typing.innerHTML =
      "🤖 Escribiendo...";

    messages.appendChild(typing);

    messages.scrollTop =
      messages.scrollHeight;
  }


  function removeTyping() {

    const typing =
      document.getElementById("typing");

    if (typing) {
      typing.remove();
    }

  }


  async function sendMessage() {

    const text =
      input.value.trim();


    if (!text) {
      return;
    }


    addMessage(
      text,
      "user"
    );


    input.value = "";


    button.disabled = true;


    showTyping();


    try {

      const response =
        await fetch(
          "/api/chat",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              message: text

            })

          }
        );


      const data =
        await response.json();


      removeTyping();


      if (!response.ok) {

        console.error(
          "Error del servidor:",
          data
        );

        addMessage(
          "⚠️ Ocurrió un error al conectar con AUTOIA.",
          "bot"
        );

        return;

      }


      addMessage(
        data.answer,
        "bot"
      );


    } catch (error) {

      removeTyping();


      console.error(
        "Error de conexión:",
        error
      );


      addMessage(
        "⚠️ No pude conectarme con el servidor. Inténtalo nuevamente.",
        "bot"
      );

    }


    button.disabled = false;

    input.focus();

  }


  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        sendMessage();

      }

    }
  );

</script>

</body>

</html>
