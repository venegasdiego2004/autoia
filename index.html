<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CARVIA | Tu asistente inteligente para vehículos</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      height: 92vh;
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(0,0,0,.12);
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: linear-gradient(
        135deg,
        #07152e,
        #0b2d61
      );

      color: white;
      padding: 18px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .robot {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: white;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 15px rgba(0,0,0,.2);
    }

    .robot::before {
      content: "IA";
      font-weight: bold;
      color: #0879ff;
      font-size: 20px;
    }

    .robot::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 8px;
      border-radius: 10px;
      background: #07152e;
      top: 17px;
      left: 13px;
      opacity: .9;
    }

    .brand-text h1 {
      font-size: 25px;
      letter-spacing: 1px;
    }

    .brand-text p {
      font-size: 13px;
      opacity: .85;
      margin-top: 3px;
    }

    .online {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .online-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #25d366;
    }

    /* =========================
       CHAT
    ========================= */

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      background: #f7f9fc;
    }

    .message {
      display: flex;
      margin-bottom: 16px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 78%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.45;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .message.bot .bubble {
      background: white;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 5px;
    }

    .message.user .bubble {
      background: #0879ff;
      color: white;
      border-bottom-right-radius: 5px;
    }

    /* =========================
       QUICK ACTIONS
    ========================= */

    .quick-actions {
      padding: 10px 18px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      background: white;
      border-top: 1px solid #e7ebf1;
    }

    .quick-actions button {
      border: 1px solid #d8e0eb;
      background: #f8fafc;
      border-radius: 20px;
      padding: 9px 13px;
      white-space: nowrap;
      cursor: pointer;
      font-size: 13px;
      transition: .2s;
    }

    .quick-actions button:hover {
      background: #eaf3ff;
      border-color: #0879ff;
    }

    /* =========================
       INPUT
    ========================= */

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: white;
      border-top: 1px solid #e7ebf1;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #d6deea;
      border-radius: 25px;
      padding: 13px 17px;
      outline: none;
      font-size: 15px;
    }

    #messageInput:focus {
      border-color: #0879ff;
    }

    #sendButton {
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #0879ff;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* =========================
       TYPING
    ========================= */

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 6px 2px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #7c8798;
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {

      0%, 80%, 100% {
        opacity: .25;
      }

      40% {
        opacity: 1;
      }

    }

    /* =========================
       CONFIRMATION
    ========================= */

    .lead-confirmation {
      background: #eefaf3;
      border: 1px solid #b7e4c7;
      color: #176b3a;
      padding: 13px 15px;
      border-radius: 14px;
      margin-top: 8px;
      font-size: 14px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      body {
        align-items: stretch;
      }

      .app {
        height: 100vh;
        border-radius: 0;
      }

      header {
        padding: 14px 16px;
      }

      .brand-text h1 {
        font-size: 21px;
      }

      .brand-text p {
        font-size: 11px;
      }

      .online {
        font-size: 11px;
      }

      .bubble {
        max-width: 88%;
      }

    }

  </style>

</head>


<body>

  <div class="app">

    <!-- HEADER -->

    <header>

      <div class="brand">

        <div class="robot"></div>

        <div class="brand-text">

          <h1>CARVIA</h1>

          <p>
            Tu asistente inteligente para vehículos
          </p>

        </div>

      </div>

      <div class="online">
        <span class="online-dot"></span>
        En línea
      </div>

    </header>


    <!-- CHAT -->

    <main id="chat"></main>


    <!-- QUICK ACTIONS -->

    <div class="quick-actions">

      <button onclick="sendQuickMessage('Muéstrame los vehículos disponibles')">
        🚗 Ver vehículos
      </button>

      <button onclick="sendQuickMessage('¿Cuáles son los precios?')">
        💰 Precios
      </button>

      <button onclick="sendQuickMessage('Quiero solicitar una cita para probar un vehículo')">
        📅 Citas de prueba
      </button>

      <button onclick="sendQuickMessage('¿Cuál es la ubicación del concesionario?')">
        📍 Ubicación
      </button>

    </div>


    <!-- INPUT -->

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Escribe tu mensaje..."
        autocomplete="off"
      >

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>


<script>

  // =====================================================
  // ESTADO DE LA CONVERSACIÓN
  // =====================================================

  let history = [];

  let lead = {
    nombre: null,
    apellido: null,
    telefono: null,
    vehiculo: null,
    presupuesto: null,
    fecha: null,
    hora: null,
    interes: "bajo"
  };

  let leadSent = false;


  // =====================================================
  // ELEMENTOS
  // =====================================================

  const chat = document.getElementById("chat");

  const input = document.getElementById("messageInput");

  const sendButton = document.getElementById("sendButton");


  // =====================================================
  // MENSAJE EN PANTALLA
  // =====================================================

  function addMessage(text, type) {

    const wrapper = document.createElement("div");

    wrapper.className = `message ${type}`;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;

  }


  // =====================================================
  // TYPING
  // =====================================================

  function showTyping() {

    const wrapper = document.createElement("div");

    wrapper.className = "message bot";

    wrapper.id = "typingMessage";

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.innerHTML = `
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    `;

    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;

  }


  function hideTyping() {

    const typing = document.getElementById("typingMessage");

    if (typing) {
      typing.remove();
    }

  }


  // =====================================================
  // MENSAJE INICIAL
  // =====================================================

  addMessage(
    "¡Hola! 👋 Soy CARVIA, tu asistente inteligente para vehículos. ¿En qué puedo ayudarte?",
    "bot"
  );


  // =====================================================
  // ENVIAR MENSAJE
  // =====================================================

  async function sendMessage(customMessage = null) {

    const message =
      customMessage !== null
        ? customMessage
        : input.value.trim();

    if (!message) return;


    addMessage(message, "user");

    input.value = "";

    sendButton.disabled = true;


    showTyping();


    try {

      const response = await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          message: message,

          history: history,

          lead: lead

        })

      });


      const data = await response.json();


      hideTyping();


      if (!response.ok) {

        addMessage(
          "Lo siento, ocurrió un error. Intenta nuevamente.",
          "bot"
        );

        sendButton.disabled = false;

        return;

      }


      // =================================================
      // ACTUALIZAR HISTORIAL
      // =================================================

      history.push({
        role: "user",
        text: message
      });


      history.push({
        role: "model",
        text: data.answer
      });


      // =================================================
      // ACTUALIZAR LEAD
      // =================================================

      if (data.lead) {

        lead = {
          ...lead,
          ...data.lead
        };

      }


      // =================================================
      // RESPUESTA
      // =================================================

      addMessage(
        data.answer,
        "bot"
      );


      // =================================================
      // ENVIAR LEAD
      // =================================================

      await checkLead();


    } catch (error) {

      console.error(error);

      hideTyping();

      addMessage(
        "No pude conectarme con el servidor. Intenta nuevamente.",
        "bot"
      );

    }


    sendButton.disabled = false;

    input.focus();

  }


  // =====================================================
  // MENSAJES RÁPIDOS
  // =====================================================

  function sendQuickMessage(message) {

    sendMessage(message);

  }


  // =====================================================
  // VERIFICAR LEAD
  // =====================================================

  async function checkLead() {

    if (leadSent) return;


    const complete =

      lead.nombre &&
      lead.apellido &&
      lead.telefono &&
      lead.vehiculo &&
      lead.fecha &&
      lead.hora;


    const highInterest =
      lead.interes === "alto";


    if (!complete || !highInterest) {
      return;
    }


    leadSent = true;


    try {

      const response = await fetch("/api/lead", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(lead)

      });


      const data = await response.json();


      if (response.ok && data.success) {

        addMessage(
          "✅ Perfecto. Hemos recibido tu solicitud y enviado tus datos al concesionario. Un asesor se comunicará contigo para confirmar la disponibilidad y coordinar tu visita. La fecha y hora todavía no están confirmadas.",
          "bot"
        );

      } else {

        leadSent = false;

      }


    } catch (error) {

      console.error(
        "Error enviando lead:",
        error
      );

      leadSent = false;

    }

  }


  // =====================================================
  // ENTER PARA ENVIAR
  // =====================================================

  input.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

      }

    }
  );

</script>

</body>

</html>
